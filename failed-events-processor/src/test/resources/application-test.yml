management:
  tracing:
    enabled: false

minio:
  url: ${minio.url}
  access-key: minio
  secret-key: password
  bucket-name: bucket
  retry:
    max-attempts: 2
    initial-delay: 1000
    multiplier: 5

otel:
  sdk:
    disabled: true

spring:
  kafka:
    bootstrap-servers: localhost:9092
    template:
      events:
        topic: events
        partition: 3
        replicas: 1
        dlt: events.DLT
        dlt-partitions: 1
      device:
        topic: device
        partition: 3
        replicas: 1
        dlt: device.DLT
        dlt-partitions: 1
    consumer:
      max-poll-records: 100
      fetch-max-wait: 500
      fetch-min-size: 1024
      enable-auto-commit: false
      group-id: device-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${schema.registry.url}
