server:
  port: ${FAILED_PROCESSOR_SERVER_PORT:8880}

management:
  endpoint:
    health:
      probes:
        enabled: ${FAILED_PROCESSOR_MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: ${FAILED_PROCESSOR_MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
  metrics:
    tags:
      application: failed-events-processor
  prometheus:
    metrics:
      export:
        enabled: ${FAILED_PROCESSOR_MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
  tracing:
    enabled: ${FAILED_PROCESSOR_MANAGEMENT_TRACING_ENABLED:true}
    sampling:
      probability: ${FAILED_PROCESSOR_MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${FAILED_PROCESSOR_MANAGEMENT_TRACING_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${FAILED_PROCESSOR_MANAGEMENT_TRACING_OTLP_PROTOCOL:http/protobuf}

opentelemetry:
  instrumentation:
    logback-mdc:
      enabled: ${FAILED_PROCESSOR_OPENTELEMETRY_INSTRUMENTATION_LOGBACK_MDC_ENABLED:true}
  service:
    name: ${FAILED_PROCESSOR_OPENTELEMETRY_SERVICE_NAME:${spring.application.name}}
  exporter:
    otlp:
      endpoint: ${FAILED_PROCESSOR_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${FAILED_PROCESSOR_OPENTELEMETRY_EXPORTER_OTLP_PROTOCOL:http/protobuf}
      timeout: ${FAILED_PROCESSOR_OPENTELEMETRY_EXPORTER_OTLP_TIMEOUT:10000}
      compression: ${FAILED_PROCESSOR_OPENTELEMETRY_EXPORTER_OTLP_COMPRESSION:gzip}
  traces:
    exporter: ${FAILED_PROCESSOR_OPENTELEMETRY_TRACES_EXPORTER:otlp}
  metrics:
    exporter: ${FAILED_PROCESSOR_OPENTELEMETRY_METRICS_EXPORTER:none}
  logs:
    exporter: ${FAILED_PROCESSOR_OPENTELEMETRY_LOGS_EXPORTER:none}
  resource-attributes:
    service.version: ${FAILED_PROCESSOR_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_VERSION:1.0.0}
    deployment.environment: ${FAILED_PROCESSOR_OPENTELEMETRY_RESOURCE_ATTRIBUTES_DEPLOYMENT_ENVIRONMENT:docker}
    service.name: ${FAILED_PROCESSOR_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_NAME:${spring.application.name}}

minio:
  url: ${MINIO_URL:http://minio:9000}
  access-key: ${MINIO_ROOT_USER:minio_admin}
  secret-key: ${MINIO_ROOT_PASSWORD:minio_pass}
  bucket-name: ${MINIO_BUCKET_NAME:bucket}
  retry:
    max-attempts: ${MINIO_RETRY_MAX_ATTEMPTS}
    initial-delay: ${MINIO_RETRY_INITIAL_DELAY}
    multiplier: ${MINIO_RETRY_MULTIPLIER}

spring:
  application:
    name: failed-events-processor
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    template:
      dlt-device-topic: ${SPRING_KAFKA_TEMPLATE_DLT_DEVICE_TOPIC:device.DLT}
      dlt-events-topic: ${SPRING_KAFKA_TEMPLATE_DLT_EVENTS_TOPIC:events.DLT}
      observation-enabled: ${SPRING_KAFKA_TEMPLATE_OBSERVATION_ENABLED:true}
    consumer:
      max-poll-records: ${SPRING_KAFKA_CONSUMER_MAX_POLL_RECORDS:20000}
      fetch-max-wait: ${SPRING_KAFKA_CONSUMER_FETCH_MAX_WAIT:500}
      fetch-min-size: ${SPRING_KAFKA_CONSUMER_FETCH_MIN_SIZE:1024}
      enable-auto-commit: ${SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:device-group}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: ${SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
      value-deserializer: ${SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER:io.confluent.kafka.serializers.KafkaAvroDeserializer}
      properties:
        schema.registry.url: ${SPRING_KAFKA_CONSUMER_PROPERTIES_SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader: ${SPRING_KAFKA_CONSUMER_PROPERTIES_SPECIFIC_AVRO_READER:true}
        avro.remove.java.properties: ${SPRING_KAFKA_CONSUMER_PROPERTIES_AVRO_REMOVE_JAVA_PROPERTIES:true}
    listener:
      ack-mode: ${SPRING_KAFKA_LISTENER_ACK_MODE:batch}
      concurrency: ${SPRING_KAFKA_LISTENER_CONCURRENCY:3}
      type: ${SPRING_KAFKA_LISTENER_TYPE:batch}
      idle-between-polls: ${SPRING_KAFKA_LISTENER_IDLE_BETWEEN_POLLS:1000}
      observation-enabled: ${SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED:true}
