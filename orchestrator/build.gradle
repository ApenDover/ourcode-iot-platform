plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    id "org.openapi.generator" version "${openApiGenerator}"
    id 'jacoco'
    id 'checkstyle'
}

group = 'ts.andrey'
version = "${appVersion}"
description = 'orchestrator'

def nexusUrl = System.getenv("NEXUS_URL") ?: project.findProperty("nexusUrl") ?: "http://localhost:7777/repository/maven-releases/"
def nexusUser = System.getenv("NEXUS_USER") ?: project.findProperty("nexusUser") ?: "admin"
def nexusPassword = System.getenv("NEXUS_PASSWORD") ?: project.findProperty("nexusPassword") ?: "admin123"

repositories {
    mavenCentral()
    maven { url "https://packages.confluent.io/maven/" }
    maven {
        url = uri(nexusUrl)
        allowInsecureProtocol = true
        credentials {
            username = nexusUser
            password = nexusPassword
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of("${javaVersion}")
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // ============= SPRING BOOT STARTERS =============
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "org.springframework.security:spring-security-oauth2-client"

    // ============= ASPECTS =============
    implementation "org.aspectj:aspectjweaver:${aspectj}"
    implementation "org.aspectj:aspectjrt:${aspectj}"

    // ============= CLOUD & FEIGN =============
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation "io.github.openfeign:feign-httpclient:${feignClient}"

    // ============= OBSERVABILITY (TRACING & METRICS) =============
    implementation "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter:$opentelemetrySpringBootVersion"
    implementation "io.micrometer:micrometer-tracing-bridge-otel"
    implementation "io.micrometer:micrometer-observation"
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // ============= ВНЕШНИЕ API =============
    implementation "ts.andrey:event-api:${eventApi}"
    implementation "ts.andrey:device-api:${deviceApi}"
    implementation "ts.andrey:router-manager-proto-client:${routerManagerApi}"

    // ============= GRPC =============
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"

    // ============= UTILITIES =============
    implementation "net.logstash.logback:logstash-logback-encoder:${logbackEncoder}"
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    implementation "org.openapitools:jackson-databind-nullable:${databindNullable}"
    implementation "jakarta.validation:jakarta.validation-api:${jakartaValidation}"

    // ============= COMPILE ONLY =============
    compileOnly 'org.projectlombok:lombok'
    compileOnly "io.swagger.core.v3:swagger-annotations:${swagger}"

    // ============= ANNOTATION PROCESSORS =============
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // ============= TEST =============
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.testcontainers:junit-jupiter"
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "com.github.dasniko:testcontainers-keycloak:${testContainerKeycloak}"
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.cloud:spring-cloud-contract-wiremock'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly "org.projectlombok:lombok"

    testAnnotationProcessor "org.projectlombok:lombok"
    testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$projectDir/src/main/resources/openapi/orchestrator-api.yml"
    outputDir = "$buildDir/generated"
    apiPackage = "ts.andrey.orchestrator.api"
    modelPackage = "ts.andrey.orchestrator.dto"
    invokerPackage = "ts.andrey.invoker"
    library = "spring-boot"
    generateApiTests = false
    generateModelTests = false
    additionalProperties = [
            interfaceOnly: "true",
            useTags      : "true",
            java8        : "true",
            useJakartaEe : "true"
    ]
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/src/main/java"
        }
    }
}
compileJava.dependsOn tasks.openApiGenerate

checkstyle {
    toolVersion = "${checkstyleToolVersion}"
    configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
    configProperties = [
            'checkstyle.suppressions.file': "$rootDir/config/checkstyle/exclude-filter.xml"
    ]
    showViolations = true
    ignoreFailures = false
    maxWarnings = 0
}

jacoco {
    toolVersion = "${jacocoToolVersion}"
    reportsDirectory = layout.buildDirectory.dir('reports/jacoco')
}

jacocoTestReport {
    reports {
        xml.required = false
        html.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/cassandra/**',
                    '**/configuration/**',
                    '**/controller/**',
                    '**/exception/**',
                    '**/*EventCollectorApplication*'
            ])
        }))
    }
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

bootJar {
    archiveFileName = "app.jar"
}