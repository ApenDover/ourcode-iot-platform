server:
  port: 8879

management:
  endpoint:
    health:
      probes:
        enabled: false
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: orchestrator
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false

otel:
  sdk:
    disabled: true
  traces:
    exporter: none
  metrics:
    exporter: none
  logs:
    exporter: none

spring:
  application:
    name: orchestrator
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: orchestrator
            client-secret: secret
            authorization-grant-type: authorization_code
            scope: openid,profile,email
  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false

feign:
  client:
    config:
      default:
        loggerLevel: full
        readTimeout: 500
        connectTimeout: 1000

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.web: DEBUG
    org.springframework.security.oauth2.server.resource: TRACE
    org.springframework.security.oauth2.jwt: TRACE
    org.springframework.web: DEBUG
    org.springframework.web.filter: DEBUG

orchestrator:
  feign-logger:
    enabled: true
  feign:
    read-timeout-ms: 500
