server:
  port: ${ORCHESTRATOR_SERVER_PORT:8879}

management:
  endpoint:
    health:
      probes:
        enabled: ${ORCHESTRATOR_MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: ${ORCHESTRATOR_MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
  metrics:
    tags:
      application: orchestrator
  prometheus:
    metrics:
      export:
        enabled: ${ORCHESTRATOR_MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
  tracing:
    enabled: ${ORCHESTRATOR_MANAGEMENT_TRACING_ENABLED:true}
    sampling:
      probability: ${ORCHESTRATOR_MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${ORCHESTRATOR_MANAGEMENT_TRACING_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${ORCHESTRATOR_MANAGEMENT_TRACING_OTLP_PROTOCOL:http/protobuf}

opentelemetry:
  instrumentation:
    logback-mdc:
      enabled: ${ORCHESTRATOR_OPENTELEMETRY_INSTRUMENTATION_LOGBACK_MDC_ENABLED:true}
  service:
    name: ${ORCHESTRATOR_OPENTELEMETRY_SERVICE_NAME:${spring.application.name}}
  exporter:
    otlp:
      endpoint: ${ORCHESTRATOR_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${ORCHESTRATOR_OPENTELEMETRY_EXPORTER_OTLP_PROTOCOL:http/protobuf}
      timeout: ${ORCHESTRATOR_OPENTELEMETRY_EXPORTER_OTLP_TIMEOUT:10000}
      compression: ${ORCHESTRATOR_OPENTELEMETRY_EXPORTER_OTLP_COMPRESSION:gzip}
  traces:
    exporter: ${ORCHESTRATOR_OPENTELEMETRY_TRACES_EXPORTER:otlp}
  metrics:
    exporter: ${ORCHESTRATOR_OPENTELEMETRY_METRICS_EXPORTER:none}
  logs:
    exporter: ${ORCHESTRATOR_OPENTELEMETRY_LOGS_EXPORTER:none}
  resource-attributes:
    service.version: ${ORCHESTRATOR_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_VERSION:1.0.0}
    deployment.environment: ${ORCHESTRATOR_OPENTELEMETRY_RESOURCE_ATTRIBUTES_DEPLOYMENT_ENVIRONMENT:docker}
    service.name: ${spring.application.name}

spring:
  application:
    name: orchestrator

orchestrator:
  integration:
    event-service:
      url: event-service:8881
    device-service:
      url: device-service:8886
    router-manager:
      host: router-manager-service
      port: 8890
