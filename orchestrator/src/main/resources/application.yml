server:
  port: ${ORCHESTRATOR_SERVER_PORT:8879}
  tomcat:
    threads:
      max: 48
      min-spare: 5
    accept-count: 100

management:
  endpoint:
    heapdump:
      access: unrestricted
    health:
      probes:
        enabled: ${ORCHESTRATOR_MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: ${ORCHESTRATOR_MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
  metrics:
    distribution:
      percentiles-histogram:
        "jvm.gc.pause": true
        "http.server.requests": true
        "http.client.requests": true
        "orchestrator.requests": true
      slo:
        "http.server.requests": 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s
    enable:
      http: true
      jvm: true
      system: true
      logback: true
    tags:
      application: orchestrator
  prometheus:
    metrics:
      export:
        enabled: ${ORCHESTRATOR_MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
  tracing:
    enabled: ${ORCHESTRATOR_MANAGEMENT_TRACING_ENABLED:true}
    sampling:
      probability: ${ORCHESTRATOR_MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${ORCHESTRATOR_MANAGEMENT_TRACING_OTLP_ENDPOINT:http://alloy:4318}
      transport: GRPC
      export:
        enabled: true

spring:
  application:
    name: orchestrator
  cloud:
    openfeign:
      httpclient:
        max-connections: 60
        max-connections-per-route: 30
        time-to-live: 180
        follow-redirects: false
        disable-ssl-validation: false
        connection-timeout: 1000
        connection-request-timeout: 160
        read-timeout-ms: 400

  data:
    redis:
      host: ${REDIS_ORCHESTRATOR_HOST}
      port: ${REDIS_ORCHESTRATOR_PORT}
      password: ${REDIS_ORCHESTRATOR_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${APP_CLIENT_ID_ORCHESTRATOR_KEYCLOAK:orchestrator}
            client-secret: ${APP_CLIENT_ORCHESTRATOR_SECRET_KEYCLOAK:EKzEMfMvm7m0P4hcjDfb9ZMstLpVbSAU}
            authorization-grant-type: ${APP_CLIENT_AUTH_TYPE_KEYCLOAK:authorization_code}
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/iot-platform
            token-uri: http://keycloak:8080/realms/iot-platform/protocol/openid-connect/token
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/iot-platform
          audiences: device-service,orchestrator,account

orchestrator:
  print-log: true
  feign-logger:
    enabled: false
  integration:
    event-service:
      url: ${EVENT_SERVICE_SERVER_PORT_URL}
    device-service:
      url: ${DEVICE_SERVICE_SERVER_PORT_URL}
    router-manager:
      host: router-manager-service
      port: 9092
  redis:
    enabled: ${ORCHESTRATOR_REDIS_ENABLED:true}
    ttl-minutes: 5

logging:
  level:
    root: INFO
    org.springframework.boot.actuate.autoconfigure.tracing: TRACE
    org.springframework.boot.actuate.autoconfigure.logging: TRACE

otel:
  resource:
    attributes:
      deployment.environment: prod
      service:
        name: orchestrator
        namespace: iot
