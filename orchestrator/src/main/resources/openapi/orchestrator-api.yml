openapi: 3.0.3
info:
  title: API Orchestrator
  version: 1.0.0
  description: Фасадный API (OIDC, Feign/gRPC к device-service, event-service, router-manager)
servers:
  - url: http://localhost:8080
paths:
  # Device Service endpoints
  /api/v1/devices:
    get:
      summary: Получить список устройств (device-service)
      security: [ { bearerAuth: [ ] } ]
      responses:
        '200':
          description: Список устройств
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Создать устройство (device-service)
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '201':
          description: Устройство создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/devices/{deviceId}:
    get:
      summary: Получить устройство по ID (device-service)
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Информация об устройстве
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      summary: Обновить устройство (device-service)
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: Устройство обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Удалить устройство (device-service)
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Устройство удалено
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # Event Service endpoints
  /api/v1/events:
    get:
      summary: Получить список событий по устройству и фильтрам (event-service)
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - { in: query, name: device_id, required: true, schema: { type: string } }
        - { in: query, name: from_timestamp, schema: { type: integer, format: int64 } }
        - { in: query, name: to_timestamp, schema: { type: integer, format: int64 } }
        - { in: query, name: type, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200':
          description: Список событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/events/{event_id}:
    get:
      summary: Получить событие по event_id и device_id (event-service)
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - { in: path, name: event_id, required: true, schema: { type: string } }
        - { in: query, name: device_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Найденное событие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # Router Manager endpoints
  /api/v1/commands:
    post:
      summary: Отправить команду устройству (router-manager)
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCommandRequest'
      responses:
        '202':
          description: Команда принята к выполнению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendCommandResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/commands/poll:
    get:
      summary: Получить команды для устройства (router-manager)
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - { in: query, name: router_serial, required: true, schema: { type: string } }
      responses:
        '200':
          description: Список команд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollCommandsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/commands/ack:
    post:
      summary: Подтвердить выполнение команды (router-manager)
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckCommandRequest'
      responses:
        '200':
          description: Команда подтверждена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckCommandResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # Orchestrator-specific endpoints
  /api/v1/devices/{deviceId}/version:
    post:
      summary: Обновить версию устройства (сага с компенсацией)
      description: >
        Шаг A: зафиксировать targetVersion в device-service (status=UPDATING).
        Шаг B: отправить команду обновления в router-manager.
        При сбое шага B — выполняется компенсация: rollback в device-service.
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ targetVersion ]
              properties:
                targetVersion: { type: string, example: "2.3.5" }
                idempotencyKey: { type: string, example: "f4f6b4a2-..." }
      responses:
        '200':
          description: Версия зафиксирована, команда отправлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string }
                  prevVersion: { type: string }
                  targetVersion: { type: string }
                  commandId: { type: string }
        '409':
          description: Конфликт версий/статуса в device-service (optimistic lock)
        '502':
          description: Сбой router-manager, выполнена компенсация
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "ROUTER_MANAGER_FAILED" }
                  compensated: { type: boolean, example: true }
                  details: { type: string }

components:
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string

  schemas:
    # Device Service schemas
    Device:
      type: object
      properties:
        deviceId:
          type: string
        deviceType:
          type: string
        createdAt:
          type: integer
          format: int64
        meta:
          type: string
        version:
          type: string
          description: Текущая версия устройства (semver)
          example: "1.2.3"
        status:
          $ref: '#/components/schemas/DeviceStatus'
        etag:
          type: integer
          format: int64
          description: Версия для оптимистичной блокировки
          example: 5

    DeviceStatus:
      type: string
      enum: [ READY, UPDATING, ERROR ]

    DeviceCreateRequest:
      type: object
      required: [ deviceType ]
      properties:
        deviceType:
          type: string
        meta:
          type: string
        version:
          type: string
          description: Начальная версия устройства
          example: "1.0.0"

    DeviceUpdateRequest:
      type: object
      properties:
        deviceType:
          type: string
        meta:
          type: string
        version:
          type: string
        status:
          $ref: '#/components/schemas/DeviceStatus'

    # Event Service schemas
    Event:
      type: object
      properties:
        event_id: { type: string, example: "event-001" }
        device_id: { type: string, example: "abc-123" }
        timestamp: { type: integer, format: int64, example: 1718920034567 }
        type: { type: string, example: "temperature" }
        payload: { type: string, example: "'t':26}" }
      required: [ event_id, device_id, timestamp, type, payload ]

    EventPage:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        page: { type: integer, example: 0 }
        size: { type: integer, example: 100 }
        total: { type: integer, example: 233 }

    # Router Manager schemas
    SendCommandRequest:
      type: object
      required: [ router_serial, command_type ]
      properties:
        router_serial:
          type: string
        command_type:
          type: string
        payload:
          type: object

    SendCommandResponse:
      type: object
      properties:
        created:
          type: integer

    PollCommandsResponse:
      type: object
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/Command'

    Command:
      type: object
      properties:
        id:
          type: string
        router_serial:
          type: string
        command_type:
          type: string
        payload:
          type: object
        status:
          type: string
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
        acked_at:
          type: string
          format: date-time

    AckCommandRequest:
      type: object
      required: [ router_serial, command_id ]
      properties:
        router_serial:
          type: string
        command_id:
          type: string

    AckCommandResponse:
      type: object
      properties:
        status:
          type: string

    # Error schemas
    Error:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        trace:
          type: string

  responses:
    BadRequest:
      description: Невалидные параметры
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: [ ]
