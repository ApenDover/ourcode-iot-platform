server:
  port: 8879

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: orchestrator
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318
      transport: HTTP
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: 1.0.0
      deployment.environment: docker

spring:
  application:
    name: orchestrator
  cloud:
    openfeign:
      httpclient:
        max-connections: 500
        max-connections-per-route: 250
        time-to-live: 180
        follow-redirects: false
        disable-ssl-validation: false
        connection-timeout: 1000
        connection-request-timeout: 1000
        read-timeout-ms: 3000
  data:
    redis:
      host: localhost
      port: 6378
      password: redis_pass
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: orchestrator
            client-secret: EKzEMfMvm7m0P4hcjDfb9ZMstLpVbSAU
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:7878/realms/iot-platform
            token-uri: http://localhost:7878/realms/iot-platform/protocol/openid-connect/token
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7878/realms/iot-platform
          audiences: device-service,orchestrator,account

orchestrator:
  print-log: true
  feign-logger:
    enabled: false
  integration:
    event-service:
      url: localhost:8881
    device-service:
      url: localhost:8886
    router-manager:
      host: localhost
      port: 9092
  redis:
    enabled: true
    ttl-minutes: 5

logging:
  level:
    feign: TRACE

