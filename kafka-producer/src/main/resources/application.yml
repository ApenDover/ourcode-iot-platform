server:
  port: ${KAFKA_PRODUCER_SERVER_PORT:8887}

management:
  endpoint:
    health:
      probes:
        enabled: ${KAFKA_PRODUCER_MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: ${KAFKA_PRODUCER_MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
  metrics:
    distribution:
      percentiles-histogram:
        jvm.gc.pause: true
    tags:
      application: ${KAFKA_PRODUCER_MANAGEMENT_METRICS_TAGS_APPLICATION:kafka-producer}
  prometheus:
    metrics:
      export:
        enabled: ${KAFKA_PRODUCER_MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
  tracing:
    enabled: ${KAFKA_PRODUCER_MANAGEMENT_TRACING_ENABLED:true}
    sampling:
      probability: ${KAFKA_PRODUCER_MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${KAFKA_PRODUCER_MANAGEMENT_TRACING_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${KAFKA_PRODUCER_MANAGEMENT_TRACING_OTLP_PROTOCOL:http/protobuf}

opentelemetry:
  instrumentation:
    logback-mdc:
      enabled: ${KAFKA_PRODUCER_OPENTELEMETRY_INSTRUMENTATION_LOGBACK_MDC_ENABLED:true}
  service:
    name: ${KAFKA_PRODUCER_OPENTELEMETRY_SERVICE_NAME:${spring.application.name}}
  exporter:
    otlp:
      endpoint: ${KAFKA_PRODUCER_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${KAFKA_PRODUCER_OPENTELEMETRY_EXPORTER_OTLP_PROTOCOL:http/protobuf}
      timeout: ${KAFKA_PRODUCER_OPENTELEMETRY_EXPORTER_OTLP_TIMEOUT:10000}
      compression: ${KAFKA_PRODUCER_OPENTELEMETRY_EXPORTER_OTLP_COMPRESSION:gzip}
  traces:
    exporter: ${KAFKA_PRODUCER_OPENTELEMETRY_TRACES_EXPORTER:otlp}
  metrics:
    exporter: ${KAFKA_PRODUCER_OPENTELEMETRY_METRICS_EXPORTER:none}
  logs:
    exporter: ${KAFKA_PRODUCER_OPENTELEMETRY_LOGS_EXPORTER:none}
  resource-attributes:
    service.version: ${KAFKA_PRODUCER_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_VERSION:1.0.0}
    deployment.environment: ${KAFKA_PRODUCER_OPENTELEMETRY_RESOURCE_ATTRIBUTES_DEPLOYMENT_ENVIRONMENT:docker}
    service.name: ${KAFKA_PRODUCER_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_NAME:${spring.application.name}}

spring:
  application:
    name: kafka-producer
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    template:
      events:
        topic: ${SPRING_KAFKA_TEMPLATE_EVENTS_TOPIC:events}
        partition: ${SPRING_KAFKA_TEMPLATE_EVENTS_PARTITION:3}
        replicas: ${SPRING_KAFKA_TEMPLATE_EVENTS_REPLICAS:1}
        dlt: ${SPRING_KAFKA_TEMPLATE_DLT_EVENTS_TOPIC:events.DLT}
        dlt-partitions: ${SPRING_KAFKA_TEMPLATE_DLT_EVENTS_PARTITION:1}
      device:
        topic: ${SPRING_KAFKA_TEMPLATE_DEVICE_TOPIC:device}
        partition: ${SPRING_KAFKA_TEMPLATE_DEVICE_PARTITION:3}
        replicas: ${SPRING_KAFKA_TEMPLATE_DEVICE_REPLICAS:1}
        dlt: ${SPRING_KAFKA_TEMPLATE_DLT_DEVICE_TOPIC:device.DLT}
        dlt-partitions: ${SPRING_KAFKA_TEMPLATE_DLT_DEVICE_PARTITION:1}
      observation-enabled: ${SPRING_KAFKA_TEMPLATE_OBSERVATION_ENABLED:true}
    producer:
      key-serializer: ${SPRING_KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      value-serializer: ${SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER:io.confluent.kafka.serializers.KafkaAvroSerializer}
      batch-size: ${SPRING_KAFKA_PRODUCER_BATCH_SIZE:16384}
      compression-type: ${SPRING_KAFKA_PRODUCER_COMPRESSION_TYPE:snappy}
      properties:
        schema.registry.url: ${SPRING_KAFKA_PRODUCER_PROPERTIES_SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        auto.register.schemas: ${SPRING_KAFKA_PRODUCER_PROPERTIES_AUTO_REGISTER_SCHEMAS:true}
        avro.remove.java.properties: ${SPRING_KAFKA_CONSUMER_PROPERTIES_AVRO_REMOVE_JAVA_PROPERTIES:true}
    consumer:
      max-poll-records: ${SPRING_KAFKA_CONSUMER_MAX_POLL_RECORDS:20000}
      fetch-max-wait: ${SPRING_KAFKA_CONSUMER_FETCH_MAX_WAIT:500}
      fetch-min-size: ${SPRING_KAFKA_CONSUMER_FETCH_MIN_SIZE:1024}
      enable-auto-commit: ${SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:device-group}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: ${SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
      value-deserializer: ${SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER:io.confluent.kafka.serializers.KafkaAvroDeserializer}
      properties:
        schema.registry.url: ${SPRING_KAFKA_CONSUMER_PROPERTIES_SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader: ${SPRING_KAFKA_CONSUMER_PROPERTIES_SPECIFIC_AVRO_READER:true}
        avro.remove.java.properties: ${SPRING_KAFKA_CONSUMER_PROPERTIES_AVRO_REMOVE_JAVA_PROPERTIES:true}
    listener:
      ack-mode: ${SPRING_KAFKA_LISTENER_ACK_MODE:batch}
      concurrency: ${SPRING_KAFKA_LISTENER_CONCURRENCY:3}
      type: ${SPRING_KAFKA_LISTENER_TYPE:batch}
      idle-between-polls: ${SPRING_KAFKA_LISTENER_IDLE_BETWEEN_POLLS:1000}
      observation-enabled: ${SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED:true}

keycloak:
  url: http://keycloak:8080
  realm: ${APP_CLIENT_REALM_NAME_KEYCLOAK:iot-platform}
  client-id: ${APP_CLIENT_ID_KEYCLOAK:device-service}
  client-secret: ${APP_CLIENT_ORCHESTRATOR_SECRET_KEYCLOAK:secret}
