server:
  port: 8887

logging:
  level:
    ts.andrey: info

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: kafka-producer
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318
      transport: HTTP
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: 1.0.0
      deployment.environment: docker

spring:
  application:
    name: kafka-producer
  kafka:
    bootstrap-servers: localhost:9094
    template:
      events:
        topic: events
        partition: 3
        replicas: 1
        dlt: events.DLT
        dlt-partitions: 1
      device:
        topic: device
        partition: 3
        replicas: 1
        dlt: device.DLT
        dlt-partitions: 1
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      batch-size: 16384
      compression-type: snappy
      properties:
        schema.registry.url: http://localhost:8081
        auto.register.schemas: true

keycloak:
  url: http://localhost:7878
  realm: iot-platform
  client-id: device-service
  client-secret: EKzEMfMvm7m0P4hcjDfb9ZMstLpVbSAU
