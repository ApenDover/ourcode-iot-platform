server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  application:
    name: event-collector
  kafka:
    bootstrap-servers: kafka:29092
    template:
      events-topic: events
      dlt-events-topic: events.DLT
      device-topic: device-id
      dlt-device-topic: device-id.DLT
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      batch-size: 16384
      compression-type: snappy
      properties:
        schema.registry.url: http://schema-registry:8081
        auto.register.schemas: true
    consumer:
      max-poll-records: 100
      fetch-max-wait: 5000
      fetch-min-size: 1024
      enable-auto-commit: false
      group-id: device-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: http://schema-registry:8081
        specific.avro.reader: true
    listener:
      ack-mode: batch
      concurrency: 3
      type: batch
      idle-between-polls: 1000

  cassandra:
    contact-points: cassandra
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: iot_service
    schema-action: CREATE_IF_NOT_EXISTS
    replication-strategy: "'class':'SimpleStrategy','replication_factor':'1'"

app:
  inter-endpoint:
    enabled: true
  cache:
    expiration:
      seconds: 30
