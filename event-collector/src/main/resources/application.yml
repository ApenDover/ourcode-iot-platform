server:
  port: ${EVENT_COLLECTOR_SERVER_PORT:8888}

management:
  endpoint:
    health:
      probes:
        enabled: ${EVENT_COLLECTOR_MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: ${EVENT_COLLECTOR_MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
  metrics:
    tags:
      application: event-collector
  prometheus:
    metrics:
      export:
        enabled: ${EVENT_COLLECTOR_MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
  tracing:
    enabled: ${EVENT_COLLECTOR_MANAGEMENT_TRACING_ENABLED:true}
    sampling:
      probability: ${EVENT_COLLECTOR_MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${EVENT_COLLECTOR_MANAGEMENT_TRACING_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${EVENT_COLLECTOR_MANAGEMENT_TRACING_OTLP_PROTOCOL:http/protobuf}

opentelemetry:
  instrumentation:
    logback-mdc:
      enabled: ${EVENT_COLLECTOR_OPENTELEMETRY_INSTRUMENTATION_LOGBACK_MDC_ENABLED:true}
  service:
    name: ${EVENT_COLLECTOR_OPENTELEMETRY_SERVICE_NAME:${spring.application.name}}
  exporter:
    otlp:
      endpoint: ${EVENT_COLLECTOR_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${EVENT_COLLECTOR_OPENTELEMETRY_EXPORTER_OTLP_PROTOCOL:http/protobuf}
      timeout: ${EVENT_COLLECTOR_OPENTELEMETRY_EXPORTER_OTLP_TIMEOUT:10000}
      compression: ${EVENT_COLLECTOR_OPENTELEMETRY_EXPORTER_OTLP_COMPRESSION:gzip}
  traces:
    exporter: ${EVENT_COLLECTOR_OPENTELEMETRY_TRACES_EXPORTER:otlp}
  metrics:
    exporter: ${EVENT_COLLECTOR_OPENTELEMETRY_METRICS_EXPORTER:none}
  logs:
    exporter: ${EVENT_COLLECTOR_OPENTELEMETRY_LOGS_EXPORTER:none}
  resource-attributes:
    service.version: ${EVENT_COLLECTOR_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_VERSION:1.0.0}
    deployment.environment: ${EVENT_COLLECTOR_OPENTELEMETRY_RESOURCE_ATTRIBUTES_DEPLOYMENT_ENVIRONMENT:docker}
    service.name: ${spring.application.name}

spring:
  application:
    name: event-collector
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    template:
      events-topic: ${SPRING_KAFKA_TEMPLATE_EVENTS_TOPIC:events}
      dlt-events-topic: ${SPRING_KAFKA_TEMPLATE_DLT_EVENTS_TOPIC:events.DLT}
      device-topic: ${SPRING_KAFKA_TEMPLATE_DEVICE_TOPIC:device}
      dlt-device-topic: ${SPRING_KAFKA_TEMPLATE_DLT_DEVICE_TOPIC:device.DLT}
      observation-enabled: ${SPRING_KAFKA_TEMPLATE_OBSERVATION_ENABLED:true}
    producer:
      key-serializer: ${SPRING_KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      value-serializer: ${SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER:io.confluent.kafka.serializers.KafkaAvroSerializer}
      batch-size: ${SPRING_KAFKA_PRODUCER_BATCH_SIZE:16384}
      compression-type: ${SPRING_KAFKA_PRODUCER_COMPRESSION_TYPE:snappy}
      properties:
        schema.registry.url: ${SPRING_KAFKA_PRODUCER_PROPERTIES_SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        auto.register.schemas: ${SPRING_KAFKA_PRODUCER_PROPERTIES_AUTO_REGISTER_SCHEMAS:true}
    consumer:
      max-poll-records: ${SPRING_KAFKA_CONSUMER_MAX_POLL_RECORDS:50000}
      fetch-max-wait: ${SPRING_KAFKA_CONSUMER_FETCH_MAX_WAIT:500}
      fetch-min-size: ${SPRING_KAFKA_CONSUMER_FETCH_MIN_SIZE:1024}
      enable-auto-commit: ${SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:device-group}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: ${SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
      value-deserializer: ${SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER:io.confluent.kafka.serializers.KafkaAvroDeserializer}
      properties:
        schema.registry.url: ${SPRING_KAFKA_CONSUMER_PROPERTIES_SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader: ${SPRING_KAFKA_CONSUMER_PROPERTIES_SPECIFIC_AVRO_READER:true}
    listener:
      ack-mode: ${SPRING_KAFKA_LISTENER_ACK_MODE:batch}
      concurrency: ${SPRING_KAFKA_LISTENER_CONCURRENCY:3}
      type: ${SPRING_KAFKA_LISTENER_TYPE:batch}
      idle-between-polls: ${SPRING_KAFKA_LISTENER_IDLE_BETWEEN_POLLS:1000}
      observation-enabled: ${SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED:true}

  cassandra:
    contact-points: ${SPRING_CASSANDRA_CONTACT_POINTS:cassandra}
    port: ${SPRING_CASSANDRA_PORT:9042}
    local-datacenter: ${SPRING_CASSANDRA_LOCAL_DATACENTER:datacenter1}
    keyspace-name: ${SPRING_CASSANDRA_KEYSPACE_NAME:iot_service}
    schema-action: ${SPRING_CASSANDRA_SCHEMA_ACTION:CREATE_IF_NOT_EXISTS}
    replication-strategy: ${SPRING_CASSANDRA_REPLICATION_STRATEGY:'class':'SimpleStrategy','replication_factor':'1'}

app:
  cassandra:
    batch-size: ${APP_CASSANDRA_BATCH_SIZE:100}
    concurrency-size: ${APP_CASSANDRA_CONCURRENCY_SIZE:5}
    error:
      max-attempts: ${APP_CASSANDRA_ERROR_MAX_ATTEMPTS:3}
      max-backoff: ${APP_CASSANDRA_ERROR_MAX_BACKOFF:100}
      jitter-factor: ${APP_CASSANDRA_ERROR_JITTER_FACTOR:0.5}
  cache:
    expiration:
      seconds: ${APP_CACHE_EXPIRATION_SECONDS:30}
