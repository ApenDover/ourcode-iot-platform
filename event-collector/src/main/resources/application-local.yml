server:
  port: 8888

logging:
  level:
    ts.andrey: debug

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: event-collector
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf

opentelemetry:
  instrumentation:
    logback-mdc:
      enabled: true
  service:
    name: ${spring.application.name}
  exporter:
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf
      timeout: 10000
      compression: gzip
  traces:
    exporter: otlp
  metrics:
    exporter: none
  logs:
    exporter: none
  resource-attributes:
    service.version: 1.0.0
    deployment.environment: docker
    service.name: ${spring.application.name}

spring:
  application:
    name: event-collector
  kafka:
    bootstrap-servers: localhost:9093
    template:
      events:
        topic: events
        partition: 3
        replicas: 1
        dlt: events.DLT
        dlt-partitions: 1
      device:
        topic: device
        partition: 3
        replicas: 1
        dlt: device.DLT
        dlt-partitions: 1
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      batch-size: 16384
      compression-type: snappy
      properties:
        schema.registry.url: http://localhost:8081
        auto.register.schemas: true
    consumer:
      max-poll-records: 50000
      fetch-max-wait: 500
      fetch-min-size: 1024
      enable-auto-commit: false
      group-id: device-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: http://localhost:8081
        specific.avro.reader: true
    listener:
      ack-mode: batch
      concurrency: 3
      type: batch
      idle-between-polls: 1000
      observation-enabled: true

  cassandra:
    contact-points: localhost
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: iot_service
    schema-action: CREATE_IF_NOT_EXISTS
    replication-strategy: "'class':'SimpleStrategy','replication_factor':'1'"

app:
  cassandra:
    batch-size: 100
    concurrency-size: 5
    error:
      max-attempts: 3
      max-backoff: 100
      jitter-factor: 0.5
  cache:
    expiration:
      seconds: 30
