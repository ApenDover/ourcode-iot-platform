server:
  port: 8886

logging:
  level:
    org.apache.kafka: OFF
    springframework.kafka: OFF
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.postgresql: DEBUG
    org.hibernate.stat: DEBUG

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: device-service
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf

opentelemetry:
  instrumentation:
    logback-mdc:
      enabled: true
  service:
    name: ${spring.application.name}
  exporter:
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf
      timeout: 10000
      compression: gzip
  traces:
    exporter: otlp
  metrics:
    exporter: none
  logs:
    exporter: none
  resource-attributes:
    service.version: 1.0.0
    deployment.environment: docker
    service.name: ${spring.application.name}

spring:
  application:
    name: device-service
  flyway:
    enabled: false
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
  jpa:
    properties:
      generate_statistics: true
    hibernate:
      query:
        in_clause_parameter_padding: true
      session:
        events:
          LOG_QUERIES_SLOWER_THAN_MS: 10
      ddl-auto: none
  sql:
    init:
      mode: always
  security:
    client:
      registration:
        device-service:
          client-id: device-service
          client-secret: secret
          authorization-grant-type: client_credentials
          scope: openid
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7878/realms/iot-platform

app:
  shardingSphere:
    logicTable: t_device
    shardingColumn: device_id
    shardCount: 2
    algorithmExpression: shard$->{Math.abs(device_id.hashCode()) %% %s}
  postgres:
    retry:
      max-attempts: 3
      initial-delay: 1000
      multiplier: 5
    batch-size: 300
  dataSources:
    - url: jdbc:postgresql://localhost:5431/iot_platform
      username: myuser
      password: strongpassword
    - url: jdbc:postgresql://localhost:5432/iot_platform
      username: myuser
      password: strongpassword
  replicaDataSources:
    - url: jdbc:postgresql://localhost:5433/iot_platform
      username: myuser
      password: strongpassword
    - url: jdbc:postgresql://localhost:5434/iot_platform
      username: myuser
      password: strongpassword
