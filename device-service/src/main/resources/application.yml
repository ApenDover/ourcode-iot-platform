server:
  port: ${DEVICE_SERVICE_SERVER_PORT:8886}

management:
  endpoint:
    health:
      probes:
        enabled: ${DEVICE_SERVICE_MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: ${DEVICE_SERVICE_MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
  metrics:
    tags:
      application: device-service
  prometheus:
    metrics:
      export:
        enabled: ${DEVICE_SERVICE_MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
  tracing:
    enabled: ${DEVICE_SERVICE_MANAGEMENT_TRACING_ENABLED:true}
    sampling:
      probability: ${DEVICE_SERVICE_MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${DEVICE_SERVICE_MANAGEMENT_TRACING_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${DEVICE_SERVICE_MANAGEMENT_TRACING_OTLP_PROTOCOL:http/protobuf}

opentelemetry:
  instrumentation:
    logback-mdc:
      enabled: ${DEVICE_SERVICE_OPENTELEMETRY_INSTRUMENTATION_LOGBACK_MDC_ENABLED:true}
  service:
    name: ${spring.application.name}
  exporter:
    otlp:
      endpoint: ${DEVICE_SERVICE_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${DEVICE_SERVICE_OPENTELEMETRY_EXPORTER_OTLP_PROTOCOL:http/protobuf}
      timeout: ${DEVICE_SERVICE_OPENTELEMETRY_EXPORTER_OTLP_TIMEOUT:10000}
      compression: ${DEVICE_SERVICE_OPENTELEMETRY_EXPORTER_OTLP_COMPRESSION:gzip}
  traces:
    exporter: ${DEVICE_SERVICE_OPENTELEMETRY_TRACES_EXPORTER:otlp}
  metrics:
    exporter: ${DEVICE_SERVICE_OPENTELEMETRY_METRICS_EXPORTER:none}
  logs:
    exporter: ${DEVICE_SERVICE_OPENTELEMETRY_LOGS_EXPORTER:none}
  resource-attributes:
    service.version: ${DEVICE_SERVICE_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_VERSION:1.0.0}
    deployment.environment: ${DEVICE_SERVICE_OPENTELEMETRY_RESOURCE_ATTRIBUTES_DEPLOYMENT_ENVIRONMENT:docker}
    service.name: ${DEVICE_SERVICE_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_NAME:${spring.application.name}}

spring:
  application:
    name: device-service
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.apache.shardingsphere.driver.ShardingSphereDriver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: device-service
            client-secret: i9sXbfCRgvZjFJxGQrfOSIUZPdkHeBPa
            client-name: device-service
            authorization-grant-type: authorization_code
            scope: profile, email
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/iot-platform
            token-uri: http://keycloak:8080/realms/iot-platform/protocol/openid-connect/token
#  security:
#    client:
#      registration:
#        device-service:
#          client-id: device-service
#          client-secret: secret
#          authorization-grant-type: client_credentials
#          scope: openid
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: http://keyloak:8080/realms/iot-platform

app:
  shardingSphere:
    logicTable: ${APP_SHARDINGSPHERE_LOGIC_TABLE:t_device}
    shardingColumn: ${APP_SHARDINGSPHERE_SHARDING_COLUMN:device_id}
    shardCount: ${APP_SHARDINGSPHERE_SHARD_COUNT:2}
    algorithmExpression: ${APP_SHARDINGSPHERE_ALGORITHM_EXPRESSION:shard$->{Math.abs(device_id.hashCode()) %% %s}}
  postgres:
    retry:
      max-attempts: ${APP_POSTGRES_RETRY_MAX_ATTEMPTS:3}
      initial-delay: ${APP_POSTGRES_RETRY_INITIAL_DELAY:1000}
      multiplier: ${APP_POSTGRES_RETRY_MULTIPLIER:5}
    batch-size: ${APP_POSTGRES_BATCH_SIZE:300}
  dataSources:
    - url: ${APP_DATASOURCE_1_URL:jdbc:postgresql://postgres1:5432/iot_platform}
      username: ${APP_DATASOURCE_1_USERNAME:myuser}
      password: ${APP_DATASOURCE_1_PASSWORD:strongpassword}
    - url: ${APP_DATASOURCE_2_URL:jdbc:postgresql://postgres2:5432/iot_platform}
      username: ${APP_DATASOURCE_2_USERNAME:myuser}
      password: ${APP_DATASOURCE_2_PASSWORD:strongpassword}
  replicaDataSources:
    - url: ${APP_REPLICA_DATASOURCE_1_URL:jdbc:postgresql://postgres1r:5432/iot_platform}
      username: ${APP_REPLICA_DATASOURCE_1_USERNAME:myuser}
      password: ${APP_REPLICA_DATASOURCE_1_PASSWORD:strongpassword}
    - url: ${APP_REPLICA_DATASOURCE_2_URL:jdbc:postgresql://postgres2r:5432/iot_platform}
      username: ${APP_REPLICA_DATASOURCE_2_USERNAME:myuser}
      password: ${APP_REPLICA_DATASOURCE_2_PASSWORD:strongpassword}
