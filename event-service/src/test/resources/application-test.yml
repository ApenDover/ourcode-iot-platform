server:
  port: 8881

logging:
  level:
    ts.andrey: debug

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: event-service
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      transport: HTTP
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.version: 1.0.0
      deployment.environment: docker

spring:
  application:
    name: event-service

  cassandra:
    keyspace-name: iot_service
    schema-action: CREATE_IF_NOT_EXISTS

app:
  events:
    page-size: 100
