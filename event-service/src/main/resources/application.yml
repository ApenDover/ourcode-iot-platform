server:
  port: ${EVENT_SERVICE_SERVER_PORT:8881}

management:
  endpoint:
    health:
      probes:
        enabled: ${EVENT_SERVICE_MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: ${EVENT_SERVICE_MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
  metrics:
    distribution:
      percentiles-histogram:
        "http.server.requests": true
        "http.client.requests": true
        "orchestrator.requests": true
      slo:
        "http.server.requests": 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s
    enable:
      http: true
      jvm: true
      system: true
      logback: true
    tags:
      application: event-service
  prometheus:
    metrics:
      export:
        enabled: ${EVENT_SERVICE_MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
  tracing:
    enabled: ${EVENT_SERVICE_MANAGEMENT_TRACING_ENABLED:true}
    sampling:
      probability: ${EVENT_SERVICE_MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${EVENT_SERVICE_MANAGEMENT_TRACING_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${EVENT_SERVICE_MANAGEMENT_TRACING_OTLP_PROTOCOL:http/protobuf}

opentelemetry:
  instrumentation:
    logback-mdc:
      enabled: ${EVENT_SERVICE_OPENTELEMETRY_INSTRUMENTATION_LOGBACK_MDC_ENABLED:true}
  service:
    name: ${EVENT_SERVICE_OPENTELEMETRY_SERVICE_NAME:${spring.application.name}}
  exporter:
    otlp:
      endpoint: ${EVENT_SERVICE_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${EVENT_SERVICE_OPENTELEMETRY_EXPORTER_OTLP_PROTOCOL:http/protobuf}
      timeout: ${EVENT_SERVICE_OPENTELEMETRY_EXPORTER_OTLP_TIMEOUT:10000}
      compression: ${EVENT_SERVICE_OPENTELEMETRY_EXPORTER_OTLP_COMPRESSION:gzip}
  traces:
    exporter: ${EVENT_SERVICE_OPENTELEMETRY_TRACES_EXPORTER:otlp}
  metrics:
    exporter: ${EVENT_SERVICE_OPENTELEMETRY_METRICS_EXPORTER:none}
  logs:
    exporter: ${EVENT_SERVICE_OPENTELEMETRY_LOGS_EXPORTER:none}
  resource-attributes:
    service.version: ${EVENT_SERVICE_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_VERSION:1.0.0}
    deployment.environment: ${EVENT_SERVICE_OPENTELEMETRY_RESOURCE_ATTRIBUTES_DEPLOYMENT_ENVIRONMENT:docker}
    service.name: ${spring.application.name}

spring:
  application:
    name: event-service

  cassandra:
    contact-points: ${SPRING_CASSANDRA_CONTACT_POINTS:cassandra}
    port: ${SPRING_CASSANDRA_PORT:9042}
    local-datacenter: ${SPRING_CASSANDRA_LOCAL_DATACENTER:datacenter1}
    keyspace-name: ${SPRING_CASSANDRA_KEYSPACE_NAME:iot_service}
    schema-action: NONE

app:
  print-log: true
