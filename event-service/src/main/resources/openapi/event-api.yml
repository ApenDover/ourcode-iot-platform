openapi: 3.0.3
info:
  title: Event Service API
  version: 1.0.0
  description: Read-only API для событий устройств (Cassandra)
servers:
  - url: http://localhost:8082
paths:
  /api/v1/events:
    get:
      tags:
        - EventsV1
      summary: Получить список событий по устройству и фильтрам
      parameters:
        - in: query
          name: device_id
          required: true
          schema: { type: string }
          description: Идентификатор устройства (partition key)
        - in: query
          name: from_timestamp
          schema: { type: integer, format: int64 }
          description: Начало интервала (Unix ms), включительно
        - in: query
          name: to_timestamp
          schema: { type: integer, format: int64 }
          description: Конец интервала (Unix ms), включительно
        - in: query
          name: type
          schema: { type: string }
          description: Фильтр по типу события
        - in: query
          name: page_token
          schema: { type: string }
          description: Пейджинг-токен для следующей страницы (cursor pagination)
      responses:
        '200':
          description: Список событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          description: Невалидные параметры
  /api/v1/events/{event_id}:
    get:
      tags:
        - EventsV1
      summary: Получить событие по event_id и device_id
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string }
        - in: query
          name: device_id
          required: true
          schema: { type: string }
          description: Partition key
      responses:
        '200':
          description: Найденное событие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Событие не найдено
components:
  schemas:
    Event:
      type: object
      properties:
        event_id: { type: string,  example: "event-001" }
        device_id: { type: string,  example: "abc-123" }
        timestamp: { type: integer, format: int64, example: 1718920034567 }
        type: { type: string,  example: "temperature" }
        payload: { type: string,  example: "'t':26}" }
      required: [ event_id, device_id, timestamp, type, payload ]
    EventPage:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        total:
          type: integer
          example: 233
          description: Общее количество событий в запросе (по фильтрам)
        page_number:
          type: integer
          nullable: true
          example: 1
          description: Номер текущей страницы (1-based). Null для запросов с page_token.
        total_pages:
          type: integer
          example: 3
          description: Общее число страниц при фиксированном размере страницы.
        next_page_token:
          type: string
          nullable: true
          description: Токен для запроса следующей страницы
