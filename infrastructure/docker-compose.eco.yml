      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  keycloak:
    mem_limit: 1g
    cpus: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  orchestrator:
