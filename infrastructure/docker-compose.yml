services:
  kafka-producer:
    build:
      context: ../kafka-producer
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: kafka-producer
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - 8887:8887
    environment:
      OTEL_SERVICE_NAME: kafka-producer
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      event-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8887/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 6s
    networks:
      - iot_network
  device-collector:
    build:
      context: ../device-collector
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: device-collector
    env_file:
      - .env
    ports:
      - 8889:8889
    restart: unless-stopped
    environment:
      OTEL_SERVICE_NAME: device-collector
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      postgres1r:
        condition: service_healthy
      postgres2r:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8889/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iot_network
  device-service:
    build:
      context: ../device-service
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: device-service
    env_file:
      - .env
    ports:
      - 8886:8886
    restart: unless-stopped
    environment:
      OTEL_SERVICE_NAME: device-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      device-collector:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres1r:
        condition: service_healthy
      postgres2r:
        condition: service_healthy
      event-collector:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8886/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 6s
    networks:
      - iot_network
  event-service:
    build:
      context: ../event-service
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: event-service
    env_file:
      - .env
    ports:
      - "8881:8881"
    restart: unless-stopped
    environment:
      OTEL_SERVICE_NAME: event-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8881/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 6s
    networks:
      - iot_network
  event-collector:
    build:
      context: ../event-collector
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: event-collector
    restart: unless-stopped
    ports:
      - 8888:8888
    env_file:
      - .env
    environment:
      OTEL_SERVICE_NAME: event-collector
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-exporter:
        condition: service_started
      schema-registry:
        condition: service_started
      grafana:
        condition: service_started
      failed-events-processor:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 6s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iot_network
  failed-events-processor:
    build:
      context: ../failed-events-processor
      dockerfile: Dockerfile
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: failed-events-processor
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - 8880:8880
    environment:
      OTEL_SERVICE_NAME: failed-events-processor
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      minio:
        condition: service_healthy
      device-collector:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8880/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 6s
    networks:
      - iot_network
  nexus:
    image: sonatype/nexus3:3.70.1
    container_name: nexus
    ports:
      - "7777:8081"
    env_file:
      - .env
    volumes:
      - ${NEXUS_DATA_DIR:-nexus-data}:/nexus-data
      - ./nexus-provisioning/create-user.sh:/opt/nexus-provisioning/create-user.sh
    restart: unless-stopped
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Dnexus.scripts.allowCreation=true"
      NEXUS_SECURITY_RANDOMPASSWORD: "false"
    entrypoint: [ "/bin/bash", "/opt/nexus-provisioning/create-user.sh" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "-u", "admin:admin123", "http://localhost:8081/service/rest/v1/status/check" ]
      interval: 10s
      retries: 12
      timeout: 5s
      start_period: 30s
    networks:
      - iot_network
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    restart: unless-stopped
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/bitnami/zookeeper
    networks:
      - iot_network
  kafka:
    image: bitnami/kafka:3.4
    container_name: kafka
    restart: unless-stopped
    environment:
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - iot_network
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://schema-registry:8081
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME=local-connect
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS=http://kafka-connect:8083
    ports:
      - "8099:8080"
    depends_on:
      - kafka
    networks:
      - iot_network
  schema-registry:
    container_name: schema-registry
    image: confluentinc/cp-schema-registry:7.5.0
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    volumes:
      - schema-registry-data:/var/lib/schema-registry
    networks:
      - iot_network
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      retries: 3
    networks:
      - iot_network
#  camunda:
#    image: camunda/camunda-bpm-platform:latest
#    container_name: camunda
#    depends_on:
#      postgres1:
#        condition: service_healthy
#    restart: unless-stopped
#    ports:
#      - "8088:8080"
#    environment:
#      DB_DRIVER: org.postgresql.Driver
  #      DB_URL: jdbc:postgresql://postgres1:5432/${APP_DATASOURCE_1_URL}
  #      DB_USERNAME: ${APP_DATASOURCE_1_USERNAME}
  #      DB_PASSWORD: ${APP_DATASOURCE_1_URL}
#    healthcheck:
#      test: [ "CMD", "curl", "-f", "http://localhost:8080/engine-rest/engine" ]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#    networks:
#      - iot_network
  postgres1:
    container_name: postgres1
    image: postgres:15
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/var/lib/postgresql/postgresql.conf"]
    ports:
      - "5431:5432"
    volumes:
      - ./postgres/master1/scripts:/docker-entrypoint-initdb.d
      - ./postgres/master1/master.conf:/var/lib/postgresql/postgresql.conf
      - ./postgres/master1/pg_hba.conf:/var/lib/postgresql/pg_hba.conf
      - postgres_data1:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_DATASOURCE_1_USERNAME}
      POSTGRES_PASSWORD: ${APP_DATASOURCE_1_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${APP_DATASOURCE_1_USERNAME}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    networks:
      - iot_network
  postgres2:
    container_name: postgres2
    image: postgres:15
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/var/lib/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/master2/scripts:/docker-entrypoint-initdb.d
      - ./postgres/master2/master.conf:/var/lib/postgresql/postgresql.conf
      - ./postgres/master2/pg_hba.conf:/var/lib/postgresql/pg_hba.conf
      - postgres_data2:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_DATASOURCE_2_USERNAME}
      POSTGRES_PASSWORD: ${APP_DATASOURCE_2_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${APP_DATASOURCE_2_USERNAME}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
    networks:
      - iot_network
  postgres1r:
    container_name: postgres1r
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_data1r:/var/lib/postgresql/data
      - ./postgres/replica1/replica.sh:/usr/local/bin/replica.sh
    command: sh /usr/local/bin/replica.sh
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_REPLICA_DATASOURCE_1_USERNAME}
      POSTGRES_PASSWORD: ${APP_REPLICA_DATASOURCE_1_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${APP_REPLICA_DATASOURCE_1_USERNAME}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
    depends_on:
      postgres1:
        condition: service_healthy
    networks:
      - iot_network
  postgres2r:
    container_name: postgres2r
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - postgres_data2r:/var/lib/postgresql/data
      - ./postgres/replica2/replica.sh:/usr/local/bin/replica.sh
    command: sh /usr/local/bin/replica.sh
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_REPLICA_DATASOURCE_2_USERNAME}
      POSTGRES_PASSWORD: ${APP_REPLICA_DATASOURCE_2_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres2:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${APP_REPLICA_DATASOURCE_2_USERNAME}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
    networks:
      - iot_network
  router-manager-service:
    build:
      context: ../router-manager-service
    container_name: router-manager-service
    env_file:
      - .env
    ports:
      - 8890:9092
      - 8891:9091
    restart: unless-stopped
    depends_on:
      postgres_router_manager:
        condition: service_healthy
      redis-rms:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:9091/metrics || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - iot_network
  postgres_router_manager:
    container_name: postgres_router_manager
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5439:5432"
    volumes:
      - postgres_data_router_manager:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_ROUTER_MANAGER_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${APP_ROUTER_MANAGER_DATASOURCE_PASSWORD}
      POSTGRES_DB: ${APP_ROUTER_MANAGER_DATASOURCE_DB}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${APP_ROUTER_MANAGER_DATASOURCE_USERNAME}", "-d", "${APP_ROUTER_MANAGER_DATASOURCE_DB}" ]
      interval: 10s
      retries: 5
    networks:
      - iot_network
  postgres_keycloak:
    container_name: postgres_keycloak
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5430:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_DATASOURCE_KEYCLOAK_USERNAME}
      POSTGRES_PASSWORD: ${APP_DATASOURCE_KEYCLOAK_PASSWORD}
      POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${APP_DATASOURCE_KEYCLOAK_USERNAME}", "-d", "${POSTGRES_KEYCLOAK_DB}" ]
      interval: 10s
      retries: 5
    networks:
      - iot_network
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    env_file:
      - .env
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres_keycloak
      KC_DB_URL_DATABASE: ${POSTGRES_KEYCLOAK_DB}
      KC_DB_USERNAME: ${APP_DATASOURCE_KEYCLOAK_USERNAME}
      KC_DB_PASSWORD: ${APP_DATASOURCE_KEYCLOAK_PASSWORD}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "7878:8080"
    depends_on:
      postgres_keycloak:
        condition: service_healthy
    networks:
      - iot_network
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - iot_network
  redis-rms:
    image: redis:7-alpine
    container_name: redis-rms
    ports:
      - "6377:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      retries: 5
    volumes:
      - redis_data_rms:/data
    networks:
      - iot_network
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: always
    depends_on:
      - redis
      - redis-rms
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data
    networks:
      - iot_network
  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    container_name: cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: "TestCluster"
      CASSANDRA_NUM_TOKENS: 256
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_RACK: "rack1"
      JVM_OPTS: >-
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=7199
        -Dcom.sun.management.jmxremote.rmi.port=7199
        -Dcom.sun.management.jmxremote.ssl=false
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.local.only=false
        -Djava.rmi.server.hostname=cassandra
    healthcheck:
      test: [ "CMD", "cqlsh", "-e", "describe keyspaces" ]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - iot_network
  grafana:
    image: grafana/grafana
    ports:
      - 3000:3000
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - alloy
      - tempo
    networks:
      - iot_network
  prometheus:
    image: bitnami/prometheus:latest
    ports:
      - 9090:9090
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - kafka-exporter
      - postgres-exporter1
      - postgres-exporter2
      - postgres-exporter-rms
    networks:
      - iot_network
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - iot_network
  postgres-exporter1:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${APP_DATASOURCE_1_USERNAME}:${APP_DATASOURCE_1_PASSWORD}@postgres1:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres1:
        condition: service_healthy
    networks:
      - iot_network
  postgres-exporter2:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter2
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${APP_DATASOURCE_2_USERNAME}:${APP_DATASOURCE_2_PASSWORD}@postgres2:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres2:
        condition: service_healthy
    networks:
      - iot_network
  postgres-exporter-rms:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-rms
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${APP_ROUTER_MANAGER_DATASOURCE_USERNAME}:${APP_ROUTER_MANAGER_DATASOURCE_PASSWORD}@postgres_router_manager:5432/${APP_ROUTER_MANAGER_DATASOURCE_DB}?sslmode=disable"
    depends_on:
      postgres_router_manager:
        condition: service_healthy
    networks:
      - iot_network
  cassandra-exporter:
    image: criteord/cassandra_exporter:latest
    container_name: cassandra-exporter
    restart: unless-stopped
    environment:
      CASSANDRA_EXPORTER_CONFIG_host: cassandra:7199
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - iot_network
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    user: "root"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_chunks:/tmp/loki/chunks
      - loki_index:/tmp/loki/index
      - loki_rules:/tmp/loki/rules
    networks:
      - iot_network
  alloy:
    image: grafana/alloy:v1.10.2
    container_name: alloy
    user: root
    ports:
      - "9080:9080"  # HTTP-интерфейс Alloy
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    environment:
      GRAFANA_LOKI_URL: http://loki:3100/loki/api/v1/push  # локальный Loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - iot_network
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - iot_network
volumes:
  nexus-data:
  schema-registry-data:
  zookeeper_data:
  postgres_data_router_manager:
  postgres_keycloak_data:
  postgres_data1:
  postgres_data2:
  postgres_data1r:
  postgres_data2r:
  redis_data:
  redis_data_rms:
  redis-insight:
  cassandra_data:
  grafana_data:
  prometheus_data:
  kafka_data:
  loki_chunks:
  loki_index:
  loki_rules:
  tempo_data:
networks:
  iot_network:
