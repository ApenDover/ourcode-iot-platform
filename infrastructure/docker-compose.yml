services:
  kafka-producer:
    build:
      context: ../kafka-producer
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: kafka-producer
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - 8887:8887
    environment:
      JAVA_OPTS: >-
        -Xmx512m
        -Xms256m
        -XX:MaxRAMPercentage=60.0
        -XX:+UseZGC
        -XX:+ZUncommit
        -XX:ZUncommitDelay=30
      OTEL_SERVICE_NAME: kafka-producer
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      event-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8887/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 6s
    networks:
      - iot_network
  device-collector:
    build:
      context: ../device-collector
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: device-collector
    env_file:
      - .env
    ports:
      - 8889:8889
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -Xmx512m
        -Xms256m
        -XX:MaxRAMPercentage=60.0
        -XX:+UseZGC
        -XX:+ZUncommit
        -XX:ZUncommitDelay=30
      OTEL_SERVICE_NAME: device-collector
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      postgres1r:
        condition: service_healthy
      postgres2r:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8889/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - iot_network
  orchestrator:
    build:
      context: ../orchestrator
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: orchestrator
    env_file:
      - .env
    ports:
      - 8879:8879
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -Xmx512m
        -Xms256m
        -XX:MaxRAMPercentage=60.0
        -XX:+UseZGC
        -XX:+ZUncommit
        -XX:ZUncommitDelay=30
      OTEL_SERVICE_NAME: orchestrator
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      redis-orchestrator:
        condition: service_healthy
      device-collector:
        condition: service_started
      device-service:
        condition: service_started
      router-manager-service:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8879/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iot_network
  device-service:
    build:
      context: ../device-service
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: device-service
    env_file:
      - .env
    ports:
      - 8886:8886
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -Xmx512m
        -Xms256m
        -XX:MaxRAMPercentage=60.0
        -XX:+UseZGC
        -XX:+ZUncommit
        -XX:ZUncommitDelay=30
      OTEL_SERVICE_NAME: device-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      device-collector:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres1r:
        condition: service_healthy
      postgres2r:
        condition: service_healthy
      event-collector:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8886/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 6s
    networks:
      - iot_network
  event-service:
    build:
      context: ../event-service
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: event-service
    env_file:
      - .env
    ports:
      - "8881:8881"
    restart: unless-stopped
    environment:
      JAVA_OPTS: >-
        -Xmx2g
        -Xms2g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:G1ReservePercent=15
        -XX:InitiatingHeapOccupancyPercent=35
        -XX:+ParallelRefProcEnabled
        -XX:+AlwaysPreTouch
        -XX:NativeMemoryTracking=summary
      OTEL_SERVICE_NAME: event-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8881/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 6s
    networks:
      - iot_network
  event-collector:
    build:
      context: ../event-collector
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: event-collector
    restart: unless-stopped
    ports:
      - 8888:8888
    env_file:
      - .env
    environment:
      JAVA_OPTS: >-
        -Xmx512m
        -Xms256m
        -XX:MaxRAMPercentage=60.0
        -XX:+UseZGC
        -XX:+ZUncommit
        -XX:ZUncommitDelay=30
      OTEL_SERVICE_NAME: event-collector
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      kafka:
        condition: service_started
      cassandra:
        condition: service_healthy
      cassandra-exporter:
        condition: service_started
      schema-registry:
        condition: service_started
      grafana:
        condition: service_started
      failed-events-processor:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 6s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iot_network
  failed-events-processor:
    build:
      context: ../failed-events-processor
      dockerfile: Dockerfile
      args:
        NEXUS_URL: ${NEXUS_URL}
        NEXUS_USER: ${NEXUS_USER}
        NEXUS_USER_PASSWORD: ${NEXUS_USER_PASSWORD}
    container_name: failed-events-processor
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - 8880:8880
    environment:
      OTEL_SERVICE_NAME: failed-events-processor
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
    depends_on:
      minio:
        condition: service_started
      device-collector:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8880/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 6s
    networks:
      - iot_network
  nexus:
    image: sonatype/nexus3:3.70.1
    container_name: nexus
    ports:
      - "7777:8081"
    env_file:
      - .env
    volumes:
      - ${NEXUS_DATA_DIR:-nexus-data}:/nexus-data
      - ./nexus-provisioning/create-user.sh:/opt/nexus-provisioning/create-user.sh
    restart: unless-stopped
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Dnexus.scripts.allowCreation=true"
      NEXUS_SECURITY_RANDOMPASSWORD: "false"
    entrypoint: [ "/bin/bash", "/opt/nexus-provisioning/create-user.sh" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "-u", "admin:admin123", "http://localhost:8081/service/rest/v1/status/check" ]
      interval: 10s
      retries: 12
      timeout: 5s
      start_period: 30s
    networks:
      - iot_network
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
    environment:
      CLUSTER_ID: "1g_ii0o5TXSxLYwFTyTbig"
      KAFKA_KRAFT_ENABLED: "true"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: |
        timeout 10 bash -c '
          # Проверяем, что порт слушает
          nc -z localhost 9092 || exit 1
          # Проверяем, что Kafka API доступен
          kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1
        '
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    networks:
      - iot_network
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://schema-registry:8081
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME=local-connect
      - KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS=http://kafka-connect:8083
    ports:
      - "8099:8080"
    depends_on:
      - kafka
    networks:
      - iot_network
  schema-registry:
    container_name: schema-registry
    image: confluentinc/cp-schema-registry:7.5.0
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_started
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    volumes:
      - schema-registry-data:/var/lib/schema-registry
    networks:
      - iot_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
#    healthcheck:
#      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
#      interval: 30s
#      retries: 3
    networks:
      - iot_network

  postgres1:
    container_name: postgres1
    image: postgres:15-alpine  # Более легкая версия
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/var/lib/postgresql/postgresql.conf"]
    ports:
      - "5431:5432"
    volumes:
      - ./postgres/master1/scripts:/docker-entrypoint-initdb.d
      - ./postgres/master1/master.conf:/var/lib/postgresql/postgresql.conf
      - ./postgres/master1/pg_hba.conf:/var/lib/postgresql/pg_hba.conf
      - postgres_data1:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_DATASOURCE_1_USERNAME}
      POSTGRES_PASSWORD: ${APP_DATASOURCE_1_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${APP_DATASOURCE_1_USERNAME}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    networks:
      - iot_network

  postgres2:
    container_name: postgres2
    image: postgres:15-alpine  # Более легкая версия
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/var/lib/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/master2/scripts:/docker-entrypoint-initdb.d
      - ./postgres/master2/master.conf:/var/lib/postgresql/postgresql.conf
      - ./postgres/master2/pg_hba.conf:/var/lib/postgresql/pg_hba.conf
      - postgres_data2:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_DATASOURCE_2_USERNAME}
      POSTGRES_PASSWORD: ${APP_DATASOURCE_2_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${APP_DATASOURCE_2_USERNAME}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
    networks:
      - iot_network

  postgres1r:
    container_name: postgres1r
    image: postgres:15-alpine  # Более легкая версия
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_data1r:/var/lib/postgresql/data
      - ./postgres/replica1/replica.sh:/usr/local/bin/replica.sh
    command: sh /usr/local/bin/replica.sh
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_REPLICA_DATASOURCE_1_USERNAME}
      POSTGRES_PASSWORD: ${APP_REPLICA_DATASOURCE_1_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${APP_REPLICA_DATASOURCE_1_USERNAME}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
    depends_on:
      postgres1:
        condition: service_healthy
    networks:
      - iot_network

  postgres2r:
    container_name: postgres2r
    image: postgres:15-alpine  # Более легкая версия
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - postgres_data2r:/var/lib/postgresql/data
      - ./postgres/replica2/replica.sh:/usr/local/bin/replica.sh
    command: sh /usr/local/bin/replica.sh
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_REPLICA_DATASOURCE_2_USERNAME}
      POSTGRES_PASSWORD: ${APP_REPLICA_DATASOURCE_2_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres2:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${APP_REPLICA_DATASOURCE_2_USERNAME}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
    networks:
      - iot_network

  router:
    build:
      context: ../router
    container_name: router
    environment:
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      router-manager-service:
        condition: service_healthy
      event-collector:
        condition: service_healthy
    networks:
      - iot_network

  router-manager-service:
    build:
      context: ../router-manager-service
    container_name: router-manager-service
    env_file:
      - .env
    ports:
      - 8890:9092
      - 8891:9091
    restart: unless-stopped
    depends_on:
      postgres_router_manager:
        condition: service_healthy
      redis-rms:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:9091/metrics || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - iot_network

  postgres_router_manager:
    container_name: postgres_router_manager
    image: postgres:15-alpine  # Более легкая версия
    restart: unless-stopped
    ports:
      - "5439:5432"
    volumes:
      - postgres_data_router_manager:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_ROUTER_MANAGER_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${APP_ROUTER_MANAGER_DATASOURCE_PASSWORD}
      POSTGRES_DB: ${APP_ROUTER_MANAGER_DATASOURCE_DB}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${APP_ROUTER_MANAGER_DATASOURCE_USERNAME}", "-d", "${APP_ROUTER_MANAGER_DATASOURCE_DB}" ]
      interval: 10s
      retries: 5
    networks:
      - iot_network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak
    environment:
      - KC_CACHE=ispn
      - KC_METRICS_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_DB=dev-file
    env_file:
      - .env
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "7878:8080"
    networks:
      - iot_network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - iot_network

  redis-rms:
    image: redis:7-alpine
    container_name: redis-rms
    ports:
      - "6377:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      retries: 5
    volumes:
      - redis_data_rms:/data
    networks:
      - iot_network

  redis-orchestrator:
    image: redis:7-alpine
    container_name: redis-orchestrator
    ports:
      - "6378:6379"
    command: redis-server --requirepass ${REDIS_ORCHESTRATOR_PASSWORD}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_ORCHESTRATOR_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_ORCHESTRATOR_PASSWORD}", "ping" ]
      interval: 5s
      retries: 5
    volumes:
      - redis_data_orc:/data
    networks:
      - iot_network

  redis-insight:
    image: redis/redisinsight:2.60  # Конкретная версия
    container_name: redis-insight
    restart: always
    depends_on:
      - redis
      - redis-rms
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data
    networks:
      - iot_network

  cassandra:
    image: cassandra:4.0
    container_name: cassandra
    restart: unless-stopped
    mem_limit: 7g
    environment:
      CASSANDRA_CLUSTER_NAME: "TestCluster"
      CASSANDRA_NUM_TOKENS: 256
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_RACK: "rack1"
      MAX_HEAP_SIZE: "2G"
      HEAP_NEWSIZE: "512M"
      JVM_OPTS: >-
        -XX:MaxGCPauseMillis=500
        -XX:+UnlockExperimentalVMOptions
        -XX:+UseContainerSupport
        -XX:InitialRAMPercentage=70.0
        -XX:MaxRAMPercentage=80.0
        -XX:+AlwaysPreTouch
        -Djava.net.preferIPv4Stack=true
        -Dcassandra.skip_wait_for_gossip_to_settle=0
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=7199
        -Dcom.sun.management.jmxremote.rmi.port=7199
        -Dcom.sun.management.jmxremote.ssl=false
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.local.only=false
        -Djava.rmi.server.hostname=cassandra
    ports:
      - "9042:9042"
    healthcheck:
      test: [ "CMD", "cqlsh", "-e", "describe keyspaces" ]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - iot_network

  # --- МОНИТОРИНГ ---

  grafana:
    image: grafana/grafana:11.0.0  # Конкретная версия
    ports:
      - 3000:3000
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - alloy
      - tempo
    networks:
      - iot_network

  prometheus:
    image: prom/prometheus:v2.51.0  # Официальный образ с конкретной версией
    ports:
      - 9090:9090
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - kafka-exporter
      - postgres-exporter
    networks:
      - iot_network

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0  # Конкретная версия
    container_name: kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_started
    networks:
      - iot_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0  # Конкретная версия
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: |
        user=${APP_DATASOURCE_1_USERNAME} password=${APP_DATASOURCE_1_PASSWORD} host=postgres1 port=5432 dbname=${POSTGRES_DB} sslmode=disable,
        user=${APP_DATASOURCE_2_USERNAME} password=${APP_DATASOURCE_2_PASSWORD} host=postgres2 port=5432 dbname=${POSTGRES_DB} sslmode=disable,
        user=${APP_DATASOURCE_1_USERNAME} password=${APP_DATASOURCE_1_PASSWORD} host=postgres1r port=5432 dbname=${POSTGRES_DB} sslmode=disable,
        user=${APP_DATASOURCE_2_USERNAME} password=${APP_DATASOURCE_2_PASSWORD} host=postgres2r port=5432 dbname=${POSTGRES_DB} sslmode=disable,
        user=${APP_ROUTER_MANAGER_DATASOURCE_USERNAME} password=${APP_ROUTER_MANAGER_DATASOURCE_PASSWORD} host=postgres_router_manager port=5432 dbname=${APP_ROUTER_MANAGER_DATASOURCE_DB} sslmode=disable
      DATA_SOURCE_LABELS: "instance=postgres1,role=primary,service=orchestrator instance=postgres2,role=primary,service=device instance=postgres1r,role=replica,service=orchestrator instance=postgres2r,role=replica,service=device instance=postgres_router_manager,role=primary,service=router_manager"
    ports:
      - "9187:9187"
    depends_on:
      - postgres1
      - postgres2
      - postgres1r
      - postgres2r
      - postgres_router_manager
    networks:
      - iot_network

  cassandra-exporter:
    image: bitnamilegacy/cassandra-exporter:2.3.8-debian-12-r51
    container_name: cassandra-exporter
    restart: unless-stopped
    environment:
      CASSANDRA_EXPORTER_CONFIG_host: cassandra:7199
      CASSANDRA_HOST: cassandra
      CASSANDRA_JMX_PORT_NUMBER: 7199
    volumes:
      - ./cassandra/exporter/config.yml:/opt/bitnami/cassandra-exporter/config.yml:ro
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - iot_network

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    user: "root"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_chunks:/tmp/loki/chunks
      - loki_index:/tmp/loki/index
      - loki_rules:/tmp/loki/rules
    networks:
      - iot_network

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: alloy
    user: root
    ports:
      - "9080:9080"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    environment:
      GRAFANA_LOKI_URL: http://loki:3100/loki/api/v1/push
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - iot_network

  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - iot_network

volumes:
  nexus-data:
  schema-registry-data:
  zookeeper_data:
  postgres_data_router_manager:
  postgres_data1:
  postgres_data2:
  postgres_data1r:
  postgres_data2r:
  redis_data:
  redis_data_rms:
  redis_data_orc:
  redis-insight:
  cassandra_data:
  grafana_data:
  prometheus_data:
  kafka_data:
  loki_chunks:
  loki_index:
  loki_rules:
  tempo_data:

networks:
  iot_network:
    name: iot_network
