server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 30s

usage_report:
  reporting_enabled: false

compactor:
  compaction:
    block_retention: 12h
    compacted_block_retention: 30m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
