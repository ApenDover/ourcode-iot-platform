scrape_configs:
  - job_name: 'kafka-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['kafka-exporter:9308']
  - job_name: 'postgres-exporter1'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: [ 'postgres-exporter1:9187' ]
  - job_name: 'postgres-exporter2'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: [ 'postgres-exporter2:9187' ]
  - job_name: 'cassandra-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: [ 'cassandra-exporter:8080' ]
  - job_name: 'event-collector'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'event-collector:8888' ]
  - job_name: 'device-collector'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'device-collector:8889' ]
