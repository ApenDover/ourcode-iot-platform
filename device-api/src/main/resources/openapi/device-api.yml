openapi: 3.0.3
info:
  title: Device Service API
  version: 1.0.0
servers:
  - url: http://localhost:8886
paths:
  /api/v1/devices:
    post:
      tags:
        - DeviceV1
      summary: Создание устройства
      operationId: createDevice
      requestBody:
        $ref: '#/components/requestBodies/DeviceCreateRequest'
      responses:
        '201':
          description: Устройство создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/DeviceError'

  /api/v1/devices/{deviceId}:
    get:
      tags:
        - DeviceV1
      summary: Получить устройство по ID
      operationId: getDevice
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Информация об устройстве
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/DeviceError'

    put:
      tags:
        - DeviceV1
      summary: Обновить устройство
      operationId: updateDevice
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        $ref: '#/components/requestBodies/DeviceUpdateRequest'
      responses:
        '200':
          description: Устройство обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/DeviceError'

    delete:
      tags:
        - DeviceV1
      summary: Удалить устройство
      operationId: deleteDevice
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Устройство удалено
        '404':
          $ref: '#/components/responses/DeviceError'

  # НОВЫЕ ЭНДПОИНТЫ ДЛЯ SAGA
  /api/v1/devices/{deviceId}/version:
    patch:
      tags:
        - DeviceV1
      summary: Зафиксировать целевую версию устройства (Шаг A SAGA)
      description: |
        Обновляет версию устройства и устанавливает статус UPDATING.
        Используется оптимистичная блокировка через поле version.
      operationId: updateDeviceVersion
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceVersionUpdateRequest'
      responses:
        '200':
          description: Версия успешно зафиксирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceVersionResponse'
        '400':
          $ref: '#/components/responses/DeviceError'
        '404':
          $ref: '#/components/responses/DeviceError'
        '409':
          description: Конфликт версий (optimistic locking)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DeviceError'

  /api/v1/devices/{deviceId}/version/rollback:
    post:
      tags:
        - DeviceV1
      summary: Откат версии устройства (Компенсация SAGA)
      description: |
        Откатывает версию устройства к предыдущему значению и устанавливает статус READY.
        Должен быть идемпотентным.
      operationId: rollbackDeviceVersion
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceVersionRollbackRequest'
      responses:
        '200':
          description: Версия успешно откатана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceVersionResponse'
        '400':
          $ref: '#/components/responses/DeviceError'
        '404':
          $ref: '#/components/responses/DeviceError'

components:
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string

  requestBodies:
    DeviceCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceCreateRequest'
    DeviceUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceUpdateRequest'

  schemas:
    # СУЩЕСТВУЮЩИЕ СХЕМЫ С ДОПОЛНЕНИЯМИ
    Device:
      type: object
      properties:
        deviceId:
          type: string
        deviceType:
          type: string
        createdAt:
          type: integer
          format: int64
        meta:
          type: string
        version:
          type: string
          description: Текущая версия устройства (semver)
          example: "1.2.3"
        status:
          type: string
          description: Статус устройства
          enum: [READY, UPDATING, ERROR]
          example: "READY"
        etag:
          type: integer
          format: int64
          description: Версия для оптимистичной блокировки
          example: 5

    DeviceCreateRequest:
      type: object
      required: [ deviceType ]
      properties:
        deviceType:
          type: string
        meta:
          type: string
        version:
          type: string
          description: Начальная версия устройства
          example: "1.0.0"

    DeviceUpdateRequest:
      type: object
      properties:
        deviceType:
          type: string
        meta:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [READY, UPDATING, ERROR]

    # НОВЫЕ СХЕМЫ ДЛЯ SAGA
    DeviceVersionUpdateRequest:
      type: object
      required: [targetVersion]
      properties:
        targetVersion:
          type: string
          description: Целевая версия для обновления
          example: "2.3.5"
        expectedVersion:
          type: integer
          format: int64
          description: Ожидаемая версия etag для оптимистичной блокировки
          example: 5

    DeviceVersionRollbackRequest:
      type: object
      required: [rollbackTo, status]
      properties:
        rollbackTo:
          type: string
          description: Версия, к которой нужно откатиться
          example: "1.2.3"
        status:
          type: string
          enum: [READY]
          description: Статус после отката
          example: "READY"
        expectedVersion:
          type: integer
          format: int64
          description: Ожидаемая версия etag для оптимистичной блокировки
          example: 6

    DeviceVersionResponse:
      type: object
      properties:
        deviceId:
          type: string
        prevVersion:
          type: string
          description: Предыдущая версия устройства
          example: "1.2.3"
        targetVersion:
          type: string
          description: Текущая/целевая версия устройства
          example: "2.3.5"
        status:
          type: string
          enum: [READY, UPDATING, ERROR]
        etag:
          type: integer
          format: int64
          description: Новая версия для оптимистичной блокировки
          example: 6

    DeviceError:
      type: object
      description: RFC 7807 описание ошибок
      properties:
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        trace:
          type: string

  responses:
    DeviceError:
      description: Ответ с ошибкой
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DeviceError'
