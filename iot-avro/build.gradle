plugins {
    id "java-library"
    id "com.github.davidmc24.gradle.plugin.avro" version "${gradlePluginAvro}"
    id "maven-publish"
}

group = "ts.andrey"
version = "${appVersion}"
description = 'iot-avro'

def nexusUrl = System.getenv("NEXUS_URL") ?: project.findProperty("nexusUrl") ?: "http://localhost:7777/repository/maven-releases/"
def nexusUser = System.getenv("NEXUS_USER") ?: project.findProperty("nexusUser") ?: "admin"
def nexusPassword = System.getenv("NEXUS_PASSWORD") ?: project.findProperty("nexusPassword") ?: "admin123"

repositories {
    mavenCentral()
    maven { url "https://packages.confluent.io/maven/" }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = "iot-avro"
        }
    }
    repositories {
        maven {
            name = "nexus"
            url = uri(nexusUrl)
            allowInsecureProtocol = true
            credentials {
                username = nexusUser
                password = nexusPassword
            }
        }
    }
}

avro {
    fieldVisibility = "PRIVATE"
    createSetters = false
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}


dependencies {
    api "org.apache.avro:avro:${avroVersion}"
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/src/main/java"
        }
    }
}
