databaseChangeLog:
  - changeSet:
      id: 20250815203900
      author: a.tsaregorodtsev
      changes:
        - createTable:
            tableName: tdevice
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: device_uuid_pk
              - column:
                  name: deviceid
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: device_type
                  type: text
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: version
                  type: bigint
              - column:
                  name: meta
                  type: text
        - sql: SELECT * FROM public.tdevice;
