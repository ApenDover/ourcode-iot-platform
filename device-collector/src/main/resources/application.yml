server:
  port: ${DEVICE_COLLECTOR_SERVER_PORT:8889}

management:
  endpoint:
    health:
      probes:
        enabled: ${DEVICE_COLLECTOR_MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: ${DEVICE_COLLECTOR_MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
  metrics:
    tags:
      application: device-collector
  prometheus:
    metrics:
      export:
        enabled: ${DEVICE_COLLECTOR_MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
  tracing:
    enabled: ${DEVICE_COLLECTOR_MANAGEMENT_TRACING_ENABLED:true}
    sampling:
      probability: ${DEVICE_COLLECTOR_MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    otlp:
      endpoint: ${DEVICE_COLLECTOR_MANAGEMENT_TRACING_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${DEVICE_COLLECTOR_MANAGEMENT_TRACING_OTLP_PROTOCOL:http/protobuf}

opentelemetry:
  instrumentation:
    logback-mdc:
      enabled: ${DEVICE_COLLECTOR_OPENTELEMETRY_INSTRUMENTATION_LOGBACK_MDC_ENABLED:true}
  service:
    name: ${DEVICE_COLLECTOR_OPENTELEMETRY_SERVICE_NAME:${spring.application.name}}
  exporter:
    otlp:
      endpoint: ${DEVICE_COLLECTOR_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT:http://alloy:4318}
      protocol: ${DEVICE_COLLECTOR_OPENTELEMETRY_EXPORTER_OTLP_PROTOCOL:http/protobuf}
      timeout: ${DEVICE_COLLECTOR_OPENTELEMETRY_EXPORTER_OTLP_TIMEOUT:10000}
      compression: ${DEVICE_COLLECTOR_OPENTELEMETRY_EXPORTER_OTLP_COMPRESSION:gzip}
  traces:
    exporter: ${DEVICE_COLLECTOR_OPENTELEMETRY_TRACES_EXPORTER:otlp}
  metrics:
    exporter: ${DEVICE_COLLECTOR_OPENTELEMETRY_METRICS_EXPORTER:none}
  logs:
    exporter: ${DEVICE_COLLECTOR_OPENTELEMETRY_LOGS_EXPORTER:none}
  resource-attributes:
    service.version: ${DEVICE_COLLECTOR_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_VERSION:1.0.0}
    deployment.environment: ${DEVICE_COLLECTOR_OPENTELEMETRY_RESOURCE_ATTRIBUTES_DEPLOYMENT_ENVIRONMENT:docker}
    service.name: ${DEVICE_COLLECTOR_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_NAME:${spring.application.name}}

spring:
  application:
    name: device-collector
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.apache.shardingsphere.driver.ShardingSphereDriver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    template:
      template:
        device:
          topic: ${SPRING_KAFKA_TEMPLATE_DEVICE_TOPIC:device}
          partition: ${SPRING_KAFKA_TEMPLATE_DEVICE_PARTITION:3}
          replicas: ${SPRING_KAFKA_TEMPLATE_DEVICE_REPLICAS:1}
          dlt: ${SPRING_KAFKA_TEMPLATE_DLT_DEVICE_TOPIC:device.DLT}
          dlt-partitions: ${SPRING_KAFKA_TEMPLATE_DLT_DEVICE_PARTITION:1}
      observation-enabled: ${SPRING_KAFKA_TEMPLATE_OBSERVATION_ENABLED:true}
    producer:
      key-serializer: ${SPRING_KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      value-serializer: ${SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER:io.confluent.kafka.serializers.KafkaAvroSerializer}
      batch-size: ${SPRING_KAFKA_PRODUCER_BATCH_SIZE:16384}
      compression-type: ${SPRING_KAFKA_PRODUCER_COMPRESSION_TYPE:snappy}
      properties:
        schema.registry.url: ${SPRING_KAFKA_PRODUCER_PROPERTIES_SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        auto.register.schemas: ${SPRING_KAFKA_PRODUCER_PROPERTIES_AUTO_REGISTER_SCHEMAS:true}
    consumer:
      max-poll-records: ${SPRING_KAFKA_CONSUMER_MAX_POLL_RECORDS:20000}
      fetch-max-wait: ${SPRING_KAFKA_CONSUMER_FETCH_MAX_WAIT:500}
      fetch-min-size: ${SPRING_KAFKA_CONSUMER_FETCH_MIN_SIZE:1024}
      enable-auto-commit: ${SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:device-group}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: ${SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
      value-deserializer: ${SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER:io.confluent.kafka.serializers.KafkaAvroDeserializer}
      properties:
        schema.registry.url: ${SPRING_KAFKA_CONSUMER_PROPERTIES_SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader: ${SPRING_KAFKA_CONSUMER_PROPERTIES_SPECIFIC_AVRO_READER:true}
        avro.remove.java.properties: ${SPRING_KAFKA_CONSUMER_PROPERTIES_AVRO_REMOVE_JAVA_PROPERTIES:true}
    listener:
      ack-mode: ${SPRING_KAFKA_LISTENER_ACK_MODE:batch}
      concurrency: ${SPRING_KAFKA_LISTENER_CONCURRENCY:3}
      type: ${SPRING_KAFKA_LISTENER_TYPE:batch}
      idle-between-polls: ${SPRING_KAFKA_LISTENER_IDLE_BETWEEN_POLLS:1000}
      observation-enabled: ${SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED:true}

app:
  shardingSphere:
    logicTable: ${APP_SHARDINGSPHERE_LOGIC_TABLE:t_device}
    shardingColumn: ${APP_SHARDINGSPHERE_SHARDING_COLUMN:device_id}
    shardCount: ${APP_SHARDINGSPHERE_SHARD_COUNT:2}
    algorithmExpression: ${APP_SHARDINGSPHERE_ALGORITHM_EXPRESSION:shard$->{Math.abs(device_id.hashCode()) %% %s}}
  postgres:
    retry:
      max-attempts: ${APP_POSTGRES_RETRY_MAX_ATTEMPTS:3}
      initial-delay: ${APP_POSTGRES_RETRY_INITIAL_DELAY:1000}
      multiplier: ${APP_POSTGRES_RETRY_MULTIPLIER:5}
    batch-size: ${APP_POSTGRES_BATCH_SIZE:300}
  dataSources:
    - url: ${APP_DATASOURCE_1_URL:jdbc:postgresql://postgres1:5432/iot_platform}
      username: ${APP_DATASOURCE_1_USERNAME:myuser}
      password: ${APP_DATASOURCE_1_PASSWORD:strongpassword}
    - url: ${APP_DATASOURCE_2_URL:jdbc:postgresql://postgres2:5432/iot_platform}
      username: ${APP_DATASOURCE_2_USERNAME:myuser}
      password: ${APP_DATASOURCE_2_PASSWORD:strongpassword}
  replicaDataSources:
    - url: ${APP_REPLICA_DATASOURCE_1_URL:jdbc:postgresql://postgres1r:5432/iot_platform}
      username: ${APP_REPLICA_DATASOURCE_1_USERNAME:myuser}
      password: ${APP_REPLICA_DATASOURCE_1_PASSWORD:strongpassword}
    - url: ${APP_REPLICA_DATASOURCE_2_URL:jdbc:postgresql://postgres2r:5432/iot_platform}
      username: ${APP_REPLICA_DATASOURCE_2_USERNAME:myuser}
      password: ${APP_REPLICA_DATASOURCE_2_PASSWORD:strongpassword}
