spring:
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${kafka.bootstrap.servers}
    template:
      events:
        topic: events
        partition: 3
        replicas: 1
        dlt: events.DLT
        dlt-partitions: 1
      device:
        topic: device
        partition: 3
        replicas: 1
        dlt: device.DLT
        dlt-partitions: 1
    consumer:
      max-poll-records: 1
      properties:
        schema.registry.url: ${schema.registry.url}
        avro.remove.java.properties: true
      group-id: group
    producer:
      properties:
        schema.registry.url: ${schema.registry.url}

otel:
  traces:
    exporter: none
  metrics:
    exporter: none
  logs:
    exporter: none

app:
  shardingSphere:
    logicTable: t_device
    shardingColumn: device_id
    shardCount: 2
    algorithmExpression: shard$->{Math.abs(device_id.hashCode()) %% %s}
  postgres:
    retry:
      max-attempts: 2
      initial-delay: 1000
      multiplier: 5
    batch-size: 300
