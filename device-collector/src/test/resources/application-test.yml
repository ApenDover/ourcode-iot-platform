spring:
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create
  kafka:
    bootstrap-servers: ${kafka.bootstrap.servers}
    consumer:
      properties:
        schema.registry.url: ${schema.registry.url}
        avro.remove.java.properties: true
    producer:
      properties:
        schema.registry.url: ${schema.registry.url}
        avro.remove.java.properties: true
otel:
  traces:
    exporter: none
  metrics:
    exporter: none
  logs:
    exporter: none
