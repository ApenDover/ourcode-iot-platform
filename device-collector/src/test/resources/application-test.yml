spring:
  liquibase:
    enabled: false
  kafka:
    bootstrap-servers: ${kafka.bootstrap.servers}
    template:
      device-topic: deviceOne
      dlt-device-topic: dltDeviceOne
    consumer:
      max-poll-records: 1
      properties:
        schema.registry.url: ${schema.registry.url}
        avro.remove.java.properties: true
      group-id: group
    producer:
      properties:
        schema.registry.url: ${schema.registry.url}

otel:
  traces:
    exporter: none
  metrics:
    exporter: none
  logs:
    exporter: none

app.postgres.retry.max-attempts: 1
